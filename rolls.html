---
layout: default
title: Rolls
---
<div>
    <h2 class="h2">Rolls</h2>             
        {% assign rolls = site.rolls %}

        {% for roll in rolls %}          
            <a class="roll-links" href="{{ roll.url }}">{{ roll.title | replace: '-', ' ' | capitalize}}</a>                   
        {% endfor %}
</div>
