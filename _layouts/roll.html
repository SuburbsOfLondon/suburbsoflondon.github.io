---
layout: default
---

<div>
    <h2>{{ page.title | replace: '-', ' ' | capitalize }}</h2>        
        {% assign rollPhotos = site.photos | where: roll, page.title %}
        
        {% for photo in rollPhotos %}
            <a href="{{ photo.url }}">{{ photo.title | replace: '-', ' ' | capitalize }}</a>  
            <br>        
        {% endfor %}
  </div>
